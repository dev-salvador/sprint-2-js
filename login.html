<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-body">

  <div class="auth-card">
    <h1>Login</h1>

    <form id="loginForm" class="auth-form">
      <input
        type="text"
        id="usuario"
        placeholder="Usuário"
        required
      >

      <input
        type="password"
        id="senha"
        placeholder="Senha"
        required
      >

      <button type="submit">Entrar</button>
    </form>

    <a href="cadastro.html" class="auth-link">
      Criar conta
    </a>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
