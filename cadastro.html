<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-body">

  <div class="auth-card">
    <h1>Cadastro</h1>

    <form id="cadastroForm" class="auth-form">
      <input
        type="text"
        id="novoUsuario"
        placeholder="Usuário"
        required
      >

      <input
        type="password"
        id="novaSenha"
        placeholder="Senha"
        required
      >

      <button
        type="submit"
        class="btn-cadastro">
        Cadastrar
      </button>
    </form>

    <a href="login.html" class="auth-link">
      Já tenho conta
    </a>
  </div>

  <script src="js/cadastro.js"></script>
</body>
</html>
